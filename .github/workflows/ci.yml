name: Validate and build TOUCHLINE
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm run build
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser and rendering tests
        run: pnpm run test:e2e
      - name: Source archive
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/touchline-source.zip HEAD
          cp pnpm-lock.yaml artifacts/pnpm-lock.yaml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touchline-build-and-visual-tests
          path: |
            dist/
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
