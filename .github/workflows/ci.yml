name: Validate and build TOUCHLINE
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: touchline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install exact direct dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser and rendering tests
        run: npm run test:e2e
      - name: Source archive
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=zip --output=artifacts/touchline-source.zip HEAD
          cp package-lock.json artifacts/package-lock.json 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touchline-build-and-visual-tests
          path: |
            dist/
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
